name: Windows fork release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-fork-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix packages/standalone --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix packages/desktop --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm install --prefix .verify/browser --no-package-lock --ignore-scripts playwright@1.58.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node .verify/browser/node_modules/playwright/cli.js install chromium
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup update stable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default stable
      - name: Verify source and build web assets
        run: |
          npm run typecheck:standalone
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build:standalone-ui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/build-manifest.mjs --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/test-all.mjs --mode contributor
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Browser regressions and screenshots
        run: |
          $env:OFM_PLAYWRIGHT_MODULE = Join-Path $PWD '.verify/browser/node_modules/playwright'
          $env:OFM_UI_SCREENSHOT_DIR = Join-Path $PWD 'release-assets'
          node scripts/standalone-react-ui-test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/standalone-i18n-browser-test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Windows x64 installer
        run: |
          npm --prefix packages/desktop run build -- --bundles nsis
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item packages/desktop/src-tauri/target/release/bundle/nsis/*.exe release-assets/
      - name: Package plugin and verification files
        run: |
          npm pack --ignore-scripts --pack-destination release-assets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/prepare-fork-release.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-localized-release
          path: release-assets/
          if-no-files-found: error
      - name: Publish fork release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release-assets -File | ForEach-Object FullName
          gh release create v2.5.5-en.1 @assets --target $env:GITHUB_SHA --title 'Our Free Model 2.5.5 — English/Chinese fork' --notes-file docs/releases/v2.5.5-en.1.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
